name: Cartes publiques

# Quand Rafael met l'étiquette « carte-approuvee » sur une demande,
# la carte est ajoutée à cartes-publiques.json, puis la demande est fermée.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: cartes-publiques
  cancel-in-progress: false

jobs:
  ajouter:
    if: github.event.label.name == 'carte-approuvee' && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier et ajouter la carte
        id: carte
        run: node .github/scripts/ajouter-carte.mjs

      - name: Enregistrer
        if: steps.carte.outputs.ajoutee == 'oui'
        env:
          NOM: ${{ steps.carte.outputs.nom }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cartes-publiques.json
          git commit -m "Carte publique : $NOM"
          git push

      - name: Répondre et fermer la demande
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.carte.outputs.message }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          gh issue edit "$NUMERO" --repo "$GITHUB_REPOSITORY" --remove-label carte-en-attente || true
          gh issue close "$NUMERO" --repo "$GITHUB_REPOSITORY"

      - name: Signaler un problème
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.carte.outputs.message }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body "${MESSAGE:-❌ La carte n'a pas pu être ajoutée. Regarde l'onglet Actions pour le détail.}"
          gh issue edit "$NUMERO" --repo "$GITHUB_REPOSITORY" --remove-label carte-approuvee || true
