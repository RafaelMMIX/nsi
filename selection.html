<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <title>Bienvenue | NSI Hub</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="level-selection">

        <div class="selection-content">

            <div class="selection-logo">
                <i class="fa-solid fa-code"></i>
            </div>

            <h1>Bienvenue sur NSI Hub</h1>

            <p>
                Choisis ton profil pour personnaliser ton espace.
            </p>


            <div class="level-cards">

                <button class="level-card level-card-disabled" disabled>
                    <div class="level-icon">
                        <i class="fa-solid fa-laptop-code"></i>
                    </div>
                
                    <div class="level-card-content">
                        <h2>SNT</h2>
                        <p>Sciences numériques et technologie</p>
                    </div>
                
                    <span class="coming-soon-badge">
                        Bientôt
                    </span>
                </button>

                <button
                    class="level-card level-card-disabled"
                    disabled
                    data-level="premiere"
                >

                    <div class="level-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>

                    <div>
                        <h2>Première</h2>

                        <p>
                            Découvrir et apprendre les bases
                            de la NSI.
                        </p>
                    </div>

                    <span class="coming-soon-badge">
                        Bientôt
                    </span>

                </button>


                <button
                    class="level-card"
                    data-level="terminale"
                >

                    <div class="level-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>

                    <div>
                        <h2>Terminale</h2>

                        <p>
                            Approfondir la NSI et préparer
                            le Bac.
                        </p>
                    </div>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

                <button class="level-card level-card-disabled" disabled data-level="professeur">
                <div class="level-icon">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>

                <div>
                    <h2>Professeur</h2>
                    <p>Espace dédié aux enseignants</p>
                </div>

                <span class="coming-soon-badge">
                    Bientôt
                </span>

            </button>

            </div>

        </div>

    </main>


    <script src="selection.js"></script>

    <script src="statistiques.js"></script>
</body>

</html>
