<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bienvenue | NSI Hub</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="level-selection">

        <div class="selection-content">

            <div class="selection-logo">
                <i class="fa-solid fa-code"></i>
            </div>

            <h1>Bienvenue sur NSI Hub</h1>

            <p>
                Pour personnaliser ton espace,
                sélectionne ton niveau.
            </p>


            <div class="level-cards">

                <button
                    class="level-card"
                    data-level="premiere"
                >

                    <div class="level-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>

                    <div>
                        <h2>Première</h2>

                        <p>
                            Découvrir et apprendre les bases
                            de la NSI.
                        </p>
                    </div>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


                <button
                    class="level-card"
                    data-level="terminale"
                >

                    <div class="level-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>

                    <div>
                        <h2>Terminale</h2>

                        <p>
                            Approfondir la NSI et préparer
                            le Bac.
                        </p>
                    </div>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </div>

        </div>

    </main>


    <script src="selection.js"></script>

</body>

</html>
