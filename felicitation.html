<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Une bonne nouvelle ! | NSI Hub</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="felicitation.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="celebration-page">

    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <main class="celebration-container">

        <div class="celebration-content" id="celebration-content">

            <div class="celebration-badge">
                <i class="fa-solid fa-star"></i>
                NSI HUB
            </div>

            <div class="celebration-question" id="question">
                Tu sais quoi ?
            </div>

            <p class="celebration-intro" id="celebration-intro">Une petite annonce qui mérite une grande célébration.</p>

            <button class="reveal-button" id="reveal-button" type="button" aria-expanded="false" aria-controls="celebration-result">
                <span>J'ai une idée...</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <div class="celebration-result" id="celebration-result" aria-live="polite">

                <div class="result-icon">
                    <i class="fa-solid fa-party-horn"></i>
                </div>

                <span class="result-label">
                    INFORMATION IMPORTANTE
                </span>

                <h1>
                    LE PROF A<br>
                    <span>APPROUVÉ LE SITE !!!</span>
                </h1>

                <p>
                    NSI Hub est officiellement validé.
                    Le projet peut continuer à vivre.
                </p>

                <div class="celebration-stars">
                    <span>★</span>
                    <span>★</span>
                    <span>★</span>
                    <span>★</span>
                    <span>★</span>
                </div>

                <button class="continue-button" id="continue-button" type="button">
                    Continuer vers NSI Hub
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </div>

        </div>

        <div class="celebration-footer">
            NSI Hub · Une bonne nouvelle méritait une page entière.
        </div>

    </main>

    <script src="felicitation.js"></script>

</body>
</html>
